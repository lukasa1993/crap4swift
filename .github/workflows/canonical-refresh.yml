name: Canonical production refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.head_ref == 'canonical-refresh-v1' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-refresh-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate the canonical repository
        run: |
          set -euo pipefail
          rm -rf /tmp/quality-tool-generator /tmp/generated-quality-tool
          mkdir -p /tmp/quality-tool-generator
          base="https://raw.githubusercontent.com/lukasa1993/crap4rust/main/tools"
          curl --fail --location --retry 3 "$base/quality_tool_generator_logical_fix.py" -o /tmp/quality-tool-generator/quality_tool_generator_logical_fix.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_1.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_1.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_2.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_2.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_3.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_3.py
          python /tmp/quality-tool-generator/quality_tool_generator_logical_fix.py --repo "${GITHUB_REPOSITORY#*/}" --output /tmp/generated-quality-tool
          rm -rf src tests test
          rm -f .gitignore LICENSE README.md SKILL.md pyproject.toml package.json package-lock.json tsconfig.json
          mkdir -p .github/workflows
          find .github/workflows -type f ! -name canonical-refresh.yml ! -name ci.yml -delete
          cp /tmp/generated-quality-tool/.gitignore .
          cp /tmp/generated-quality-tool/LICENSE .
          cp /tmp/generated-quality-tool/README.md .
          cp /tmp/generated-quality-tool/SKILL.md .
          cp /tmp/generated-quality-tool/pyproject.toml .
          cp -R /tmp/generated-quality-tool/src .
          cp -R /tmp/generated-quality-tool/tests .
          cp /tmp/generated-quality-tool/.github/workflows/ci.yml .github/workflows/ci.yml
      - name: Build and verify the exact generated tree
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install --force-reinstall dist/*.whl pytest
          python -m pip check
          python -m pytest -q
          "${GITHUB_REPOSITORY#*/}" --version
          "${GITHUB_REPOSITORY#*/}" --help
          swiftc -parse tests/fixtures/sample.swift
      - name: Commit only the verified canonical tree
        run: |
          set -euo pipefail
          rm .github/workflows/canonical-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh ${GITHUB_REPOSITORY#*/} from the reviewed generator"
          git push origin HEAD:canonical-refresh-v1
