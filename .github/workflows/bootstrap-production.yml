name: Generate verified production source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'production-hardening-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the reviewed generator
        run: |
          mkdir -p /tmp/quality-tool-generator
          base="https://raw.githubusercontent.com/lukasa1993/crap4rust/main/tools"
          curl --fail --location --retry 3 "$base/quality_tool_generator_logical_fix.py" -o /tmp/quality-tool-generator/quality_tool_generator.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_1.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_1.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_2.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_2.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_3.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_3.py
      - name: Generate and verify the package
        run: |
          rm -rf /tmp/generated-repo
          mkdir -p /tmp/generated-repo
          python /tmp/quality-tool-generator/quality_tool_generator.py --repo "${GITHUB_REPOSITORY#*/}" --output /tmp/generated-repo
          cd /tmp/generated-repo
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install --force-reinstall dist/*.whl pytest
          python -m pytest -q
          "${GITHUB_REPOSITORY#*/}" --version
          "${GITHUB_REPOSITORY#*/}" --help
      - name: Commit the verified source tree
        run: |
          rm -rf /tmp/publish-repo
          mkdir -p /tmp/publish-repo
          python /tmp/quality-tool-generator/quality_tool_generator.py --repo "${GITHUB_REPOSITORY#*/}" --output /tmp/publish-repo
          cp /tmp/publish-repo/.github/workflows/ci.yml generated-ci.yml
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='generated-ci.yml' \
            /tmp/publish-repo/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The verified source tree is already current."
          else
            git commit -m "Harden ${GITHUB_REPOSITORY#*/} for production"
            branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push origin "HEAD:${branch}"
          fi
