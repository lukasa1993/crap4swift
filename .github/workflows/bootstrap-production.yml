name: Verify and publish production hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-merge:
    if: ${{ github.head_ref == 'production-hardening-v4' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening-v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the reviewed generator
        run: |
          mkdir -p /tmp/quality-tool-generator
          base="https://raw.githubusercontent.com/lukasa1993/crap4rust/main/tools"
          curl --fail --location --retry 3 "$base/quality_tool_generator_logical_fix.py" -o /tmp/quality-tool-generator/quality_tool_generator.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_1.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_1.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_2.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_2.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_3.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_3.py
      - name: Generate the hardened repository
        run: python /tmp/quality-tool-generator/quality_tool_generator.py --repo "${GITHUB_REPOSITORY#*/}" --output .
      - name: Build and test the generated package
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install --force-reinstall dist/*.whl pytest
          python -m pytest -q
          "${GITHUB_REPOSITORY#*/}" --version
          "${GITHUB_REPOSITORY#*/}" --help
      - name: Commit the verified source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf --ignore-unmatch package.json package-lock.json tsconfig.json src/core.ts src/index.ts src/node-shims.d.ts test
          git add -- .gitignore .github/workflows/ci.yml README.md SKILL.md pyproject.toml src tests
          git rm -- .github/workflows/bootstrap-production.yml
          git commit -m "Harden crap4swift for production"
          git push origin HEAD:production-hardening-v4
      - name: Merge the verified pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready "${{ github.event.pull_request.number }}"
          gh pr merge "${{ github.event.pull_request.number }}" --merge --delete-branch
