name: Generate production hardening

on:
  push:
    branches: [production-hardening-v2]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the reviewed generator
        run: |
          mkdir -p /tmp/quality-tool-generator
          base="https://raw.githubusercontent.com/lukasa1993/crap4rust/main/tools"
          curl --fail --location --retry 3 "$base/quality_tool_generator.py" -o /tmp/quality-tool-generator/quality_tool_generator.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_1.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_1.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_2.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_2.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_3.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_3.py
      - name: Generate the hardened repository
        run: python /tmp/quality-tool-generator/quality_tool_generator.py --repo "${GITHUB_REPOSITORY#*/}" --output .
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf --ignore-unmatch package.json package-lock.json tsconfig.json src/core.ts src/index.ts src/node-shims.d.ts test
          git add -- .gitignore .github/workflows/ci.yml README.md SKILL.md pyproject.toml src tests
          git rm -- .github/workflows/bootstrap.yml
          git commit -m "[generated] Harden project for production"
          git push origin HEAD:production-hardening-v2
