name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build wheel
        run: python -m build
      - name: Install wheel and tests
        run: python -m pip install dist/*.whl pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: CLI smoke tests
        run: |
          crap4swift --version
          crap4swift --help
      - name: Parse Swift fixture
        run: swiftc -parse tests/fixtures/sample.swift
      - name: End-to-end Swift package coverage
        run: crap4swift --root tests/fixtures/package --fail-over 100 --json > /tmp/crap4swift.json
